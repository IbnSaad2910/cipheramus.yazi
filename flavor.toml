# vim:fileencoding=utf-8:foldmethod=marker

# Palette (ported from cipheramus.omp.json) — red, grey & white/off-white,
# matching the everyday rendered prompt. Where more than one thing needs to
# stay visually distinct, bold/italic/underline/reversed do the work instead
# of reaching for extra hues.
# bg     #011627  -- dark navy (segment/editor background)
# fg     #D6DEEB  -- main light foreground
# white  #FFFFFF  -- pure white, for the brightest emphasis
# grey   #575656  -- neutral segment background
# muted  #637777  -- dimmed grey text
# red    #FF0000  -- primary accent
# red_err #E44141 -- error state

# : Manager {{{

[mgr]
cwd = { fg = "#FF0000" }

# Find
find_keyword  = { fg = "#FFFFFF", bg = "#FF0000", bold = true, italic = true, underline = true }
find_position = { fg = "#FF0000", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied   = { fg = "#FFFFFF", bg = "#FFFFFF" }
marker_cut      = { fg = "#FF0000", bg = "#FF0000" }
marker_marked   = { fg = "#575656", bg = "#575656" }
marker_selected = { fg = "#D6DEEB", bg = "#D6DEEB" }

# Count
count_copied   = { fg = "#011627", bg = "#FFFFFF" }
count_cut      = { fg = "#011627", bg = "#FF0000" }
count_selected = { fg = "#011627", bg = "#D6DEEB" }

# Border
border_symbol = "│"
border_style  = { fg = "#575656" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#011627", bg = "#FF0000", bold = true }
inactive = { fg = "#D6DEEB", bg = "#575656" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#011627", bg = "#FF0000", bold = true }
normal_alt  = { fg = "#FF0000", bg = "#575656" }

# Select mode
select_main = { fg = "#FF0000", bg = "#D6DEEB", bold = true }
select_alt  = { fg = "#D6DEEB", bg = "#575656" }

# Unset mode
unset_main = { fg = "#D6DEEB", bg = "#575656", bold = true, underline = true }
unset_alt  = { fg = "#575656", bg = "#D6DEEB" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#575656" }
perm_type  = { fg = "#575656" }
perm_read  = { fg = "#D6DEEB" }
perm_write = { fg = "#FF0000" }
perm_exec  = { fg = "#D6DEEB", bold = true }

# Progress
progress_label  = { fg = "#D6DEEB", bold = true }
progress_normal = { fg = "#D6DEEB", bg = "#575656" }
progress_error  = { fg = "#D6DEEB", bg = "#FF0000" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#FF0000" }
active   = { fg = "#D6DEEB", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#FF0000" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#FF0000" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#FF0000" }
title   = {}
hovered = { fg = "#D6DEEB", bold = true }

# : }}}


# : Which {{{

[which]
border          = { fg = "#FF0000" }
cand            = { fg = "#FFFFFF", bold = true }
rest            = { fg = "#637777" }
desc            = { fg = "#D6DEEB", italic = true }
separator       = "  "
separator_style = { fg = "#575656" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#D6DEEB" }
run     = { fg = "#FF0000" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#011627", bg = "#D6DEEB" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#FF0000" }
title    = { fg = "#FF0000" }
tbl_col  = { fg = "#D6DEEB" }
tbl_cell = { fg = "#FFFFFF", bg = "#575656" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#D6DEEB" }
title_warn  = { fg = "#FFFFFF", bold = true }
title_error = { fg = "#FF0000", bold = true }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "#D6DEEB", bold = true },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#FFFFFF", italic = true },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#FF0000" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#D6DEEB" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#637777" },
	# Fallback
	{ url = "*", fg = "#D6DEEB" },
	{ url = "*/", fg = "#FF0000" },
]

# : }}}


# : Icons {{{

[icon]
dirs = [
	{ name = ".config",     text = "", fg = "#575656" },
	{ name = ".git",        text = "", fg = "#FF0000" },
	{ name = ".github",     text = "", fg = "#D6DEEB" },
	{ name = ".npm",        text = "", fg = "#D6DEEB" },
	{ name = "Desktop",     text = "", fg = "#575656" },
	{ name = "Development", text = "", fg = "#575656" },
	{ name = "Documents",   text = "", fg = "#575656" },
	{ name = "Downloads",   text = "", fg = "#575656" },
	{ name = "Library",     text = "", fg = "#575656" },
	{ name = "Movies",      text = "", fg = "#575656" },
	{ name = "Music",       text = "", fg = "#575656" },
	{ name = "Pictures",    text = "", fg = "#575656" },
	{ name = "Public",      text = "", fg = "#575656" },
	{ name = "Videos",      text = "", fg = "#575656" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#FF0000" },
	{ if = "link",   text = "", fg = "#637777" },
	{ if = "block",  text = "", fg = "#D6DEEB" },
	{ if = "char",   text = "", fg = "#D6DEEB" },
	{ if = "fifo",   text = "", fg = "#D6DEEB" },
	{ if = "sock",   text = "", fg = "#D6DEEB" },
	{ if = "sticky", text = "", fg = "#D6DEEB" },
	{ if = "dummy",  text = "", fg = "#FF0000" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#FF0000" },
	{ if = "dir",           text = "", fg = "#FF0000" },
	{ if = "exec",          text = "", fg = "#FFFFFF", bold = true },
	{ if = "!dir",          text = "", fg = "#D6DEEB" },
]

# : }}}
